<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="needle-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#3a3a5a" stroke-width="8"/>

  <!-- Inner circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#3a3a5a" stroke-width="2"/>

  <!-- Direction markers -->
  <text x="256" y="80" text-anchor="middle" fill="#ff4757" font-size="48" font-weight="bold" font-family="Arial">N</text>
  <text x="256" y="460" text-anchor="middle" fill="#888" font-size="36" font-weight="bold" font-family="Arial">S</text>
  <text x="440" y="265" text-anchor="middle" fill="#888" font-size="36" font-weight="bold" font-family="Arial">E</text>
  <text x="72" y="265" text-anchor="middle" fill="#888" font-size="36" font-weight="bold" font-family="Arial">W</text>

  <!-- Compass needle - North (red) -->
  <polygon points="256,100 236,256 276,256" fill="url(#needle-red)"/>

  <!-- Compass needle - South (gray) -->
  <polygon points="256,412 236,256 276,256" fill="#4a4a6a"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="20" fill="#fff"/>
  <circle cx="256" cy="256" r="12" fill="#ccc"/>
</svg>
